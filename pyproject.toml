[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rernggen"
version = "0.1.0"
description = "Reproducible, open-source generative media research and engineering stack."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cheong Choonvai", email = "cheong@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "einops>=0.8.0",
    "pyyaml>=6.0",
    "diffusers>=0.30.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["research/01_dit", "research/01_dit/src", "."]
testpaths = ["research/01_dit/tests", "tests"]
