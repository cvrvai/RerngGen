# Tiny Configuration for DiT Overfit & Convergence Validation
model:
  in_channels: 4
  out_channels: 4
  latent_size: 32 # 256x256 image with f=8 VAE
  patch_size: 2
  hidden_size: 512
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  use_text_condition: false
  text_dim: 0
  time_scale: 1000.0

training:
  batch_size: 8
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
